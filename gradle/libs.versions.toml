[versions]
# Keep this values in sync with bundletool"s dependencies.
aapt2Proto = "8.13.2-14304508"
protobufJava = "4.33.5"
guava = "30.1-jre"

[libraries]
dalvikDx = "com.jakewharton.android.repackaged:dalvik-dx:16.0.1"
binaryResources = "com.android.tools.apkparser:binary-resources:31.13.2"
apkSigner = "com.android.tools.build:apksig:8.13.2"
bundleTool = "com.android.tools.build:bundletool:1.18.3"
aapt2Proto = { module = "com.android.tools.build:aapt2-proto", version.ref = "aapt2Proto" }
protobufJava = { module = "com.google.protobuf:protobuf-java", version.ref = "protobufJava" }
clikt = "com.github.ajalt.clikt:clikt:5.1.0"
junit = "junit:junit:4.13.2"
assertk = "com.willowtreeapps.assertk:assertk:0.28.1"
okio = "com.squareup.okio:okio:3.16.4"
byteunits = "com.jakewharton.byteunits:byteunits:0.9.1"
asm = "org.ow2.asm:asm:9.9.1"
diffUtils = "io.github.java-diff-utils:java-diff-utils:4.16"
picnic = "com.jakewharton.picnic:picnic:0.7.0"
mordant = "com.github.ajalt.mordant:mordant:3.0.2"
kotlinPlugin = "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0"
dokkaPlugin = "org.jetbrains.dokka:dokka-gradle-plugin:2.1.0"
mavenPublishPlugin = "com.vanniktech:gradle-maven-publish-plugin:0.36.0"
spotlessPlugin = "com.diffplug.spotless:spotless-plugin-gradle:8.2.1"
buildConfigPlugin = "com.github.gmazzo.buildconfig:plugin:6.0.7"
ktfmt = "com.facebook:ktfmt:0.61"
